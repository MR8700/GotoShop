<!DOCTYPE html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" id="theme-color-meta" />
    <title>GotoShop</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem("gotoshop_theme");
          // Default is LIGHT unless the user explicitly saved 'dark'
          if (saved === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.setAttribute("data-theme", "dark");
            var meta = document.getElementById("theme-color-meta");
            if (meta) meta.setAttribute("content", "#09090b");
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.setAttribute("data-theme", "light");
            var meta = document.getElementById("theme-color-meta");
            if (meta) meta.setAttribute("content", "#f8fafc");
          }

          var h = window.location.hostname || "localhost";
          var p = new URLSearchParams(window.location.search);
          var s = p.get("store") || localStorage.getItem("conversastore_active_slug");
          if ((h === "localhost" || h === "127.0.0.1") && s) {
            h = s + ".localhost";
          }
          document.title = "GotoShop • " + (s ? s.replace("-", " ") : "Boutiques d'Afrique");
        } catch (e) {}
      })();
    </script>
    
    <!-- Preconnect & Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>
  <body class="bg-surface font-body-md text-on-surface min-h-screen antialiased selection:bg-primary-container selection:text-on-primary-container">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
